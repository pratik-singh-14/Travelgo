<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGo | Login & Sign Up</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 24px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;

            margin: auto;

            display: grid;
            place-items: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            color: white;

            font-size: 28px;
        }

        .logo h1 {
            margin-top: 10px;

            color: #2563eb;

            font-size: 26px;
        }

        .logo p {
            margin-top: 5px;

            color: #64748b;

            font-size: 13px;
        }

        .tabs {
            display: flex;

            background: #f1f5f9;

            padding: 5px;

            border-radius: 10px;

            margin-bottom: 25px;
        }

        .tab {
            width: 50%;

            padding: 11px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: #64748b;

            font-weight: 700;

            cursor: pointer;
        }

        .tab.active {
            background: white;

            color: #2563eb;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,.08);
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h2 {
            font-size: 23px;

            color: #111827;

            margin-bottom: 7px;
        }

        .form-description {
            color: #64748b;

            font-size: 13px;

            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;

            font-weight: 700;

            color: #374151;
        }

        .input-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dbe3ee;

            border-radius: 10px;

            outline: none;

            font-size: 14px;

            transition: .2s;
        }

        .input-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37,99,235,.1);
        }

        .submit-button {
            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition: .2s;
        }

        .submit-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(37,99,235,.25);
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;
        }

        .message {
            display: none;

            margin-top: 15px;

            padding: 11px;

            border-radius: 8px;

            text-align: center;

            font-size: 12px;

            font-weight: 600;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

    </style>
</head>

<body>

    <div class="auth-container">

        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                ✈️
            </div>

            <h1>
                TravelGo
            </h1>

            <p>
                Your journey starts here.
            </p>

        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
            >
                Login
            </button>

            <button
                class="tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>


        <!-- LOGIN FORM -->

        <form
            class="form active"
            id="loginForm"
        >

            <h2>
                Welcome Back 👋
            </h2>

            <p class="form-description">
                Login to your TravelGo account.
            </p>


            <div class="input-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="loginPhone"
                    placeholder="Enter 10-digit number"
                    maxlength="10"
                >

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                Login
            </button>

        </form>


        <!-- SIGN UP FORM -->

        <form
            class="form"
            id="signupForm"
        >

            <h2>
                Create Account 🚀
            </h2>

            <p class="form-description">
                Create your TravelGo account.
            </p>


            <div class="input-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                >

            </div>


            <div class="input-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="signupPhone"
                    placeholder="Enter 10-digit number"
                    maxlength="10"
                >

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                Create Account
            </button>

        </form>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        ></div>


        <!-- HOME -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to TravelGo
        </a>

    </div>


    <script>

        const loginTab =
            document.getElementById("loginTab");

        const signupTab =
            document.getElementById("signupTab");

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");


        // =========================
        // SWITCH TO LOGIN
        // =========================

        loginTab.addEventListener(
            "click",
            function() {

                loginTab.classList.add("active");

                signupTab.classList.remove("active");

                loginForm.classList.add("active");

                signupForm.classList.remove("active");

                hideMessage();

            }
        );


        // =========================
        // SWITCH TO SIGN UP
        // =========================

        signupTab.addEventListener(
            "click",
            function() {

                signupTab.classList.add("active");

                loginTab.classList.remove("active");

                signupForm.classList.add("active");

                loginForm.classList.remove("active");

                hideMessage();

            }
        );


        // =========================
        // SIGN UP
        // =========================

        signupForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const name =
                    document.getElementById(
                        "signupName"
                    ).value.trim();

                const phone =
                    document.getElementById(
                        "signupPhone"
                    ).value.trim();


                if (name === "") {

                    showMessage(
                        "Please enter your name.",
                        "error"
                    );

                    return;
                }


                if (!/^[0-9]{10}$/.test(phone)) {

                    showMessage(
                        "Please enter a valid 10-digit mobile number.",
                        "error"
                    );

                    return;
                }


                const existingUser =
                    localStorage.getItem(
                        "travelgoUser"
                    );


                if (existingUser) {

                    const user =
                        JSON.parse(existingUser);


                    if (user.phone === phone) {

                        showMessage(
                            "Account already exists. Please login.",
                            "error"
                        );

                        return;
                    }

                }


                const newUser = {

                    name: name,

                    phone: phone,

                    createdAt:
                        new Date().toISOString()

                };


                localStorage.setItem(
                    "travelgoUser",
                    JSON.stringify(newUser)
                );


               localStorage.setItem(
    "travelgoPendingOTP",
    "true"
);

window.location.href = "otp.html";

                showMessage(
                    "Account created successfully! 🎉",
                    "success"
                );


                signupForm.reset();

            }
        );


        // =========================
        // LOGIN
        // =========================

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                const phone =
                    document.getElementById(
                        "loginPhone"
                    ).value.trim();


                if (!/^[0-9]{10}$/.test(phone)) {

                    showMessage(
                        "Please enter a valid 10-digit mobile number.",
                        "error"
                    );

                    return;
                }


                const savedUser =
                    localStorage.getItem(
                        "travelgoUser"
                    );


                if (!savedUser) {

                    showMessage(
                        "No account found. Please sign up first.",
                        "error"
                    );

                    return;
                }


                const user =
                    JSON.parse(savedUser);


                if (user.phone !== phone) {

                    showMessage(
                        "Mobile number is not registered.",
                        "error"
                    );

                    return;
                }


                localStorage.setItem(
                    "travelgoLoggedIn",
                    "true"
                );


                showMessage(
                    "Login successful! Welcome " +
                    user.name +
                    " 👋",
                    "success"
                );


                loginForm.reset();


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 1200);

            }
        );


        // =========================
        // MESSAGE
        // =========================

        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message show " + type;

        }


        function hideMessage() {

            message.className =
                "message";

        }

    </script>

</body>
</html>
