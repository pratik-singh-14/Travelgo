<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TravelGo | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #eff6ff,
        #ecfeff
    );

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.container{

    width:100%;
    max-width:420px;

    background:white;

    padding:35px;

    border-radius:22px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.1);

}

.logo{

    text-align:center;

    color:#2563eb;

    font-size:26px;

    font-weight:800;

    margin-bottom:8px;

}

.subtitle{

    text-align:center;

    color:#6b7280;

    font-size:12px;

    margin-bottom:30px;

}

.form-group{

    margin-bottom:18px;

}

label{

    display:block;

    font-size:10px;

    font-weight:800;

    margin-bottom:7px;

}

input{

    width:100%;

    height:45px;

    padding:0 13px;

    border:
    1px solid #dbe1ea;

    border-radius:9px;

    outline:none;

    font-size:12px;

}

input:focus{

    border-color:#2563eb;

}

button{

    width:100%;

    height:45px;

    border:0;

    border-radius:9px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
    );

    color:white;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

}

button:hover{

    opacity:.9;

}

.message{

    display:none;

    padding:12px;

    margin-bottom:15px;

    border-radius:8px;

    background:#fee2e2;

    color:#b91c1c;

    font-size:10px;

}

.success{

    background:#dcfce7;

    color:#166534;

}

.signup-link{

    margin-top:20px;

    text-align:center;

    color:#6b7280;

    font-size:11px;

}

.signup-link a{

    color:#2563eb;

    font-weight:800;

    text-decoration:none;

}

.back{

    display:block;

    margin-top:20px;

    text-align:center;

    color:#6b7280;

    font-size:10px;

    text-decoration:none;

}

</style>
</head>


<body>

<div class="container">

    <div class="logo">
        🚌 TravelGo
    </div>

    <p class="subtitle">
        Login to your TravelGo account
    </p>


    <div
        id="message"
        class="message"
    ></div>


    <form id="loginForm">

        <div class="form-group">

            <label>
                EMAIL
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                PASSWORD
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="signup-link">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to TravelGo

    </a>

</div>


<script>

const form =
document.getElementById("loginForm");

const message =
document.getElementById("message");


form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const email =
        document
        .getElementById("email")
        .value
        .trim();


        const password =
        document
        .getElementById("password")
        .value;


        const savedUser =
        localStorage.getItem(
            "travelGoUser"
        );


        if(!savedUser){

            showMessage(
                "No account found. Please create an account first."
            );

            return;

        }


        const user =
        JSON.parse(savedUser);


        if(
            email !== user.email ||
            password !== user.password
        ){

            showMessage(
                "Incorrect email or password."
            );

            return;

        }


        localStorage.setItem(
            "travelGoLoggedIn",
            "true"
        );


        showMessage(
            "Login successful! Redirecting...",
            true
        );


        setTimeout(
            function(){

                window.location.href = "dashboard.html";
            },
            1000
        );

    }
);


function showMessage(
    text,
    success=false
){

    message.textContent =
        text;

    message.style.display =
        "block";

    message.className =
        success
        ? "message success"
        : "message";

}

</script>

</body>
</html>
